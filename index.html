<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commute Comparison Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <h1>🏠 Commute Checker</h1>
    <p class="subtitle">Compare how far a rental is from your office</p>

    <div class="form">
      <div class="field">
        <label for="office">📍 Office Location</label>
        <input type="text" id="office" placeholder="Longitude, Latitude" />
      </div>
      <div class="field">
        <label for="rental">🏡 Rental Location</label>
        <input type="text" id="rental" placeholder="Longitude, Latitude" />
      </div>
      <button id="calculate-btn">Calculate Commute</button>
    </div>

    <div class="results hidden" id="results">
      <h2>Results</h2>
      <div class="result-grid">
        <div class="card">
          <span class="icon">🚶</span>
          <div class="label">Walking</div>
          <div class="value" id="walk-time">--</div>
        </div>
        <div class="card">
          <span class="icon">🚗</span>
          <div class="label">Driving</div>
          <div class="value" id="drive-time">--</div>
        </div>
        <div class="card">
          <span class="icon">📏</span>
          <div class="label">Distance</div>
          <div class="value" id="distance">--</div>
        </div>
        <div class="card verdict-card">
          <span class="icon">⚖️</span>
          <div class="label">Verdict</div>
          <div class="value" id="verdict">--</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js" defer></script>
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</body>

</html>
